name: CNN Fear & Greed check

# Every hour, every day (UTC). CNN's index only moves on trading days,
# but hourly runs are cheap (public repo = unlimited Actions minutes)
# and keep the state warm across weekends.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for testing

permissions:
  contents: write  # to commit state-fear-greed.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CNN Fear & Greed check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python macd_alert.py --fear-greed

      - name: Save alert state
        run: |
          git config user.name "macd-bot"
          git config user.email "macd-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add state-fear-greed.json
          git diff --cached --quiet || git commit -m "update fear-greed alert state [skip ci]"
          git push || git push
